<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bubble's Tummy Trek – Digestive System Game</title>
<meta name="description" content="An interactive game about the anatomy and physiology of the human digestive system, with Bubble the Maltese.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--coral:#ff7a59;--coral-d:#e85d3c;--teal:#1fa392;--teal-l:#d7f5ef;--sun:#ffd166;--pink:#ff6fa5;--ink:#3a2e39;--muted:#7a6a73;--card:#fff;--ok:#22c55e;--bad:#ef4444}
*{box-sizing:border-box}
body{margin:0;font-family:'Nunito',system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,#fff1e0 0%,#ffeef3 45%,#e3faf4 100%);min-height:100vh;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.btn,.pill,.logo{font-family:'Baloo 2','Nunito',sans-serif}
button{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:10px;padding:8px 16px;background:rgba(255,255,255,.75);backdrop-filter:blur(8px);position:sticky;top:0;z-index:20;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.logo{font-weight:800;font-size:1.25rem;color:var(--coral-d);display:flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}
.logo small{color:var(--teal);font-weight:700}
.spacer{flex:1}
.pill{background:#fff;border-radius:999px;padding:4px 12px;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.08);white-space:nowrap}
.iconbtn{border:none;background:#fff;border-radius:50%;width:38px;height:38px;font-size:1.1rem;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.08)}
main{max-width:1080px;margin:0 auto;padding:16px}
.btn{border:none;border-radius:14px;padding:10px 20px;font-size:1.05rem;font-weight:700;cursor:pointer;background:var(--coral);color:#fff;box-shadow:0 4px 0 var(--coral-d);transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--coral-d)}
.btn.teal{background:var(--teal);box-shadow:0 4px 0 #157a6d}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 4px 0 #e2d6dc}
.btn:disabled{opacity:.5;cursor:default}
.card{background:var(--card);border-radius:22px;padding:18px;box-shadow:0 8px 24px rgba(90,40,60,.08)}
/* Home */
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.hero h1{margin:0;font-size:clamp(2rem,5vw,3.2rem);line-height:1;color:var(--coral-d)}
.hero h1 span{color:var(--teal)}
.hero p.sub{margin:6px 0 10px;font-weight:700;color:var(--muted)}
.bubble-big{width:150px;height:150px;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-3deg)}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input.name{border:2px solid #f1dfe6;border-radius:12px;padding:10px 14px;font:inherit;font-weight:700;min-width:220px;outline:none}
input.name:focus{border-color:var(--teal)}
.langsw{display:inline-flex;background:#fff;border-radius:12px;padding:3px;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.langsw button{border:none;background:none;padding:7px 12px;border-radius:9px;font-weight:800;cursor:pointer}
.langsw button.on{background:var(--teal);color:#fff}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:18px}
.lvcard{position:relative;cursor:pointer;transition:transform .15s;border:3px solid transparent}
.lvcard:hover{transform:translateY(-4px);border-color:var(--sun)}
.lvcard .emo{font-size:2.4rem}
.lvcard h3{margin:4px 0 2px;font-size:1.3rem}
.lvcard p{margin:0 0 8px;color:var(--muted);font-weight:600}
.lvcard .num{position:absolute;top:12px;right:14px;background:var(--teal-l);color:var(--teal);border-radius:999px;padding:2px 10px;font-weight:800;font-family:'Baloo 2','Nunito',system-ui,sans-serif}
.stars{font-size:1.2rem;letter-spacing:2px}
.say{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.say svg{width:64px;height:64px;flex:none}
.say .txt{position:relative;background:#fff8e7;border:2px solid #ffe3a3;border-radius:16px;padding:10px 14px;font-weight:600;line-height:1.45}
.say .txt:before{content:"";position:absolute;left:-10px;top:18px;border:8px solid transparent;border-right-color:#ffe3a3}
/* Level layout */
.lvhead{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.lvhead h2{margin:0;font-size:1.6rem}
.split{display:grid;grid-template-columns:minmax(260px,400px) 1fr;gap:18px;align-items:start}
.diagwrap{background:#fff;border-radius:22px;padding:8px;box-shadow:0 8px 24px rgba(90,40,60,.08);position:sticky;top:66px}
.diagram{width:100%;height:auto;display:block;max-height:76vh}
.prompt{background:var(--teal);color:#fff;border-radius:16px;padding:10px 16px;font-family:'Baloo 2','Nunito',system-ui,sans-serif;font-size:1.35rem;font-weight:700;margin-bottom:12px;text-align:center}
.prompt b{color:var(--sun);font-size:1.6rem}
@media(max-width:760px){.split{grid-template-columns:1fr}.diagwrap{position:static}.diagram{max-height:46vh}.hero{grid-template-columns:1fr;text-align:center}.hero .row{justify-content:center}.bubble-big{margin:0 auto;width:120px;height:120px}.logo small{display:none}}
/* organs */
.organ{cursor:pointer;transition:filter .2s}
.organ .vis{transition:filter .25s}
.organ:hover .vis{filter:brightness(1.1) drop-shadow(0 0 4px #ffd166)}
.organ.glow .vis{filter:drop-shadow(0 0 5px #ffb703) drop-shadow(0 0 9px #ffd166)}
.organ.ok .vis{filter:drop-shadow(0 0 5px #22c55e) drop-shadow(0 0 10px #22c55e)}
.organ.bad{animation:shake .4s}
.organ.bad .vis{filter:drop-shadow(0 0 6px #ef4444)}
.organ.dim{opacity:.35}
.organ,.organ *{transform-box:fill-box;transform-origin:center}
@keyframes shake{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 14px}
.chip{background:#f6eff3;border-radius:999px;padding:5px 11px;font-weight:700;font-size:.92rem;cursor:pointer;border:2px solid transparent}
.chip.seen{background:var(--teal-l);color:#127a6c}
.chip.cur{border-color:var(--sun)}
.infobox h3{margin:0 0 6px;color:var(--coral-d);font-size:1.4rem}
.infobox p{margin:0;line-height:1.5;font-weight:600}
/* quiz */
.q{font-weight:800;font-size:1.15rem;margin:0 0 12px;line-height:1.4}
.opts{display:grid;gap:9px}
.opt{text-align:left;border:2px solid #efe2e8;background:#fff;border-radius:14px;padding:11px 14px;font-weight:700;cursor:pointer;transition:all .15s;font-size:1rem}
.opt:hover:not(:disabled){border-color:var(--teal);background:#f3fcfa}
.opt.right{background:#dcfce7;border-color:var(--ok)}
.opt.wrong{background:#fee2e2;border-color:var(--bad)}
.opt:disabled{cursor:default}
.ex{margin-top:12px;background:#f0f7ff;border-left:5px solid #60a5fa;border-radius:10px;padding:10px 12px;font-weight:600;line-height:1.45}
.ex.good{background:#ecfdf5;border-color:var(--ok)}
.ex.nope{background:#fff1f2;border-color:var(--bad)}
.meter{display:grid;gap:7px;margin-top:12px}
.meter .m{display:grid;grid-template-columns:110px 1fr 42px;align-items:center;gap:8px;font-weight:700;font-size:.9rem}
.bar{height:14px;background:#f1e7ec;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;transition:width 1.2s ease}
.foods{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.food{font-size:2.4rem;background:#fff;border:3px solid #f1dfe6;border-radius:18px;padding:8px 14px;cursor:pointer;text-align:center}
.food small{display:block;font-size:.8rem;font-weight:800}
.food:hover{border-color:var(--coral)}
.stepper{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.stepper span{flex:1;min-width:30px;height:8px;border-radius:9px;background:#f1e3ea}
.stepper span.done{background:var(--teal)}
.stepper span.now{background:var(--sun)}
/* match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.col{display:grid;gap:9px;align-content:start}
.mbtn{border:2px solid #efe2e8;background:#fff;border-radius:14px;padding:12px;font-weight:700;cursor:pointer;min-height:54px;transition:all .15s;line-height:1.3}
.mbtn.left{background:#fff7ed;border-color:#fed7aa}
.mbtn.sel{border-color:var(--teal);box-shadow:0 0 0 3px #99f6e4;transform:scale(1.02)}
.mbtn.done{background:#dcfce7;border-color:var(--ok);opacity:.75;cursor:default}
.mbtn.err{background:#fee2e2;border-color:var(--bad);animation:shake .35s}
/* timer */
.timer{height:12px;background:#f1e7ec;border-radius:99px;overflow:hidden;margin:6px 0 14px}
.timer i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--sun),var(--coral));width:100%}
.streak{font-family:'Baloo 2','Nunito',system-ui,sans-serif;font-weight:800;color:var(--coral-d)}
/* modal */
#modal{position:fixed;inset:0;background:rgba(58,46,57,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal.show{display:flex}
#modal .card{max-width:440px;width:100%;text-align:center;animation:pop .35s ease}
@keyframes pop{from{transform:scale(.7);opacity:0}}
#modal h2{margin:4px 0;font-size:1.9rem;color:var(--coral-d)}
#modal .bigstars{font-size:2.6rem;letter-spacing:4px}
/* certificate */
.cert{max-width:720px;margin:0 auto;text-align:center;border:6px double var(--sun);background:linear-gradient(#fffdf7,#fff)}
.cert h1{font-size:2.2rem;margin:4px 0;color:var(--coral-d)}
.cert .who{font-family:'Baloo 2','Nunito',system-ui,sans-serif;font-size:2.2rem;font-weight:800;color:var(--teal);border-bottom:2px dashed #e7d8de;display:inline-block;padding:0 20px;margin:4px 0 8px}
.cert table{margin:12px auto;border-collapse:collapse;font-weight:700}
.cert td{padding:5px 12px;border-bottom:1px solid #f3e8ed;text-align:left}
.rank{font-family:'Baloo 2','Nunito',system-ui,sans-serif;font-size:1.6rem;font-weight:800;color:var(--coral-d)}
/* confetti */
#fx{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
#fx i{position:absolute;top:-20px;width:10px;height:14px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.float{position:absolute;font-family:'Baloo 2','Nunito',system-ui,sans-serif;font-weight:800;color:var(--ok);font-size:1.6rem;animation:up 1s ease-out forwards}
@keyframes up{to{transform:translateY(-60px);opacity:0}}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:20px 10px 30px;font-weight:600}
@media print{header,footer,.noprint{display:none!important}body{background:#fff}.cert{box-shadow:none}}
</style>
</head>
<body>
<header>
  <div class="logo" id="logo">🐶 <span id="logoTxt">Tummy Trek</span> <small id="logoSub"></small></div>
  <div class="spacer"></div>
  <div class="pill" id="totalPill">⭐ 0</div>
  <button class="iconbtn" id="soundBtn" title="Sound">🔊</button>
  <button class="iconbtn" id="homeBtn" title="Menu">🏠</button>
</header>
<main id="app"></main>
<footer id="foot"></footer>
<div id="modal"></div>
<div id="fx"></div>

<script>
/* ============ helpers ============ */
const $ = s => document.querySelector(s);
const app = $('#app');
let lang = 'en', muted = false, playerName = '';
const tx = (en, id) => lang === 'id' ? id : en;
const L = o => (o && (o[lang] || o.en)) || '';
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const starStr = n => '⭐'.repeat(n) + '☆'.repeat(3 - n);
let store = { best: {} };
try { const s = JSON.parse(localStorage.getItem('tummytrek')); if (s) store = Object.assign(store, s); } catch (e) {}
lang = store.lang || 'en'; playerName = store.name || ''; muted = !!store.muted;
function persist() { try { store.lang = lang; store.name = playerName; store.muted = muted; localStorage.setItem('tummytrek', JSON.stringify(store)); } catch (e) {} }

/* ============ sound ============ */
let actx;
function tone(f, d, type = 'sine', t0 = 0, vol = .14) {
  if (muted) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = f;
    const t = actx.currentTime + t0;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + d + .03);
  } catch (e) {}
}
const sfx = {
  ok() { tone(660, .12, 'triangle'); tone(990, .2, 'triangle', .1); },
  bad() { tone(220, .25, 'sawtooth', 0, .06); tone(160, .3, 'sawtooth', .12, .05); },
  click() { tone(520, .05, 'square', 0, .04); },
  win() { [523, 659, 784, 1047].forEach((f, i) => tone(f, .25, 'triangle', i * .13)); },
  gulp() { tone(320, .12); tone(190, .2, 'sine', .1); },
  pop() { tone(880, .06, 'sine', 0, .08); }
};

/* ============ visual helpers ============ */
function bubbleSVG(cls = '') {
  return `<svg class="${cls}" viewBox="0 0 120 120" aria-label="Bubble the Maltese">
  <ellipse cx="60" cy="112" rx="32" ry="5" fill="rgba(0,0,0,.08)"/>
  <path d="M36 78 Q60 114 84 78 L90 106 Q60 116 30 106Z" fill="#fff" stroke="#eadfd6" stroke-width="2"/>
  <circle cx="60" cy="55" r="30" fill="#fff" stroke="#eadfd6" stroke-width="2"/>
  <path d="M30 42 Q12 70 20 102 Q33 109 40 94 Q44 70 41 46Z" fill="#fff" stroke="#eadfd6" stroke-width="2"/>
  <path d="M90 42 Q108 70 100 102 Q87 109 80 94 Q76 70 79 46Z" fill="#fff" stroke="#eadfd6" stroke-width="2"/>
  <path d="M25 70 Q28 85 26 96 M95 70 Q92 85 94 96" stroke="#efe6de" stroke-width="2" fill="none"/>
  <path d="M48 30 Q60 12 72 30" fill="#fff" stroke="#eadfd6" stroke-width="2"/>
  <path d="M60 27 L45 18 L47 34Z M60 27 L75 18 L73 34Z" fill="#ff6fa5"/><circle cx="60" cy="27" r="4.5" fill="#ff4f8b"/>
  <circle cx="49" cy="52" r="5.2" fill="#2b1d1d"/><circle cx="71" cy="52" r="5.2" fill="#2b1d1d"/>
  <circle cx="50.8" cy="50.3" r="1.7" fill="#fff"/><circle cx="72.8" cy="50.3" r="1.7" fill="#fff"/>
  <ellipse cx="60" cy="66" rx="11" ry="8" fill="#fffaf4"/>
  <ellipse cx="60" cy="62" rx="4.6" ry="3.6" fill="#2b1d1d"/>
  <path d="M54 68 Q60 73 66 68" stroke="#2b1d1d" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <path d="M57.5 70 Q60 79 62.5 70Z" fill="#ff8fa3"/>
  <circle cx="42" cy="64" r="4" fill="#ffc1d3" opacity=".75"/><circle cx="78" cy="64" r="4" fill="#ffc1d3" opacity=".75"/>
  </svg>`;
}
const say = t => `<div class="say">${bubbleSVG()}<div class="txt">${t}</div></div>`;

function confetti(n = 70) {
  const fx = $('#fx'), cols = ['#ff7a59', '#1fa392', '#ffd166', '#ff6fa5', '#60a5fa', '#a78bfa'];
  for (let i = 0; i < n; i++) {
    const c = document.createElement('i');
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = cols[i % cols.length];
    c.style.animationDuration = (1.6 + Math.random() * 1.6) + 's';
    c.style.animationDelay = (Math.random() * .4) + 's';
    fx.appendChild(c); setTimeout(() => c.remove(), 3600);
  }
}
function floatText(el, text) {
  const r = el.getBoundingClientRect(), f = document.createElement('div');
  f.className = 'float'; f.textContent = text;
  f.style.left = (r.left + r.width / 2 - 20) + 'px'; f.style.top = (r.top) + 'px'; f.style.position = 'fixed';
  $('#fx').appendChild(f); setTimeout(() => f.remove(), 1000);
}
const isNarrow = () => window.matchMedia('(max-width:760px)').matches;
function scrollToEl(el) { if (isNarrow() && el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }

/* ============ DATA: organs ============ */
const ORG = [
  { id: 'mouth', n: { en: 'Mouth', id: 'Mulut' }, e: '👄',
    i: { en: "Digestion starts here! Teeth chew food into small pieces (mechanical digestion) and the enzyme amylase in saliva starts breaking starch into sugar (chemical digestion). The tongue rolls food into a soft ball called a bolus.",
         id: "Pencernaan dimulai di sini! Gigi mengunyah makanan menjadi potongan kecil (pencernaan mekanis) dan enzim amilase dalam ludah mulai memecah amilum menjadi gula (pencernaan kimiawi). Lidah membentuk makanan menjadi gumpalan lunak yang disebut bolus." } },
  { id: 'esophagus', n: { en: 'Esophagus', id: 'Kerongkongan' }, e: '🛝',
    i: { en: "A muscular tube about 25 cm long that connects the mouth to the stomach. Waves of muscle squeezing, called peristalsis, push food down. No digestion happens here!",
         id: "Saluran berotot sepanjang sekitar 25 cm yang menghubungkan mulut dengan lambung. Gelombang remasan otot yang disebut gerak peristaltik mendorong makanan ke bawah. Di sini tidak terjadi pencernaan!" } },
  { id: 'stomach', n: { en: 'Stomach', id: 'Lambung' }, e: '🫃',
    i: { en: "A stretchy, J-shaped muscular bag. It churns food with gastric juice: hydrochloric acid (HCl) kills germs and the enzyme pepsin starts digesting protein. Food becomes a thick soup called chyme.",
         id: "Kantong berotot berbentuk huruf J yang elastis. Lambung mengaduk makanan dengan getah lambung: asam klorida (HCl) membunuh kuman dan enzim pepsin mulai mencerna protein. Makanan menjadi bubur kental yang disebut kimus." } },
  { id: 'liver', n: { en: 'Liver', id: 'Hati' }, e: '🟤',
    i: { en: "The largest internal organ! It makes bile, a green-yellow liquid that breaks fat into tiny droplets (emulsification), so enzymes can digest fat more easily. It is an accessory organ — food never passes through it.",
         id: "Organ dalam terbesar! Hati menghasilkan empedu, cairan hijau kekuningan yang memecah lemak menjadi butiran kecil (emulsi) agar enzim lebih mudah mencerna lemak. Hati adalah organ tambahan — makanan tidak melewatinya." } },
  { id: 'gallbladder', n: { en: 'Gallbladder', id: 'Kantong empedu' }, e: '🟢',
    i: { en: "A small green pouch tucked under the liver. It stores bile and squirts it into the small intestine when fatty food arrives.",
         id: "Kantong kecil berwarna hijau di bawah hati. Kantong empedu menyimpan empedu dan mengalirkannya ke usus halus saat makanan berlemak datang." } },
  { id: 'pancreas', n: { en: 'Pancreas', id: 'Pankreas' }, e: '🟡',
    i: { en: "A leaf-shaped gland behind the stomach. It makes pancreatic juice full of enzymes — amylase (for starch), trypsin (for protein) and lipase (for fat) — and sends it into the small intestine.",
         id: "Kelenjar berbentuk seperti daun di belakang lambung. Pankreas menghasilkan getah pankreas yang berisi enzim — amilase (untuk amilum), tripsin (untuk protein), dan lipase (untuk lemak) — lalu mengalirkannya ke usus halus." } },
  { id: 'smallInt', n: { en: 'Small intestine', id: 'Usus halus' }, e: '🍝',
    i: { en: "About 6 metres long — the longest part! Digestion is finished here and nutrients are absorbed into the blood through millions of tiny finger-like villi.",
         id: "Panjangnya sekitar 6 meter — bagian terpanjang! Di sini pencernaan diselesaikan dan sari makanan diserap ke dalam darah melalui jutaan jonjot usus (vili) yang kecil seperti jari." } },
  { id: 'largeInt', n: { en: 'Large intestine', id: 'Usus besar' }, e: '🌀',
    i: { en: "About 1.5 m long and wider than the small intestine. It absorbs water and minerals, and its friendly bacteria make vitamin K. Leftovers become solid feces.",
         id: "Panjangnya sekitar 1,5 m dan lebih lebar daripada usus halus. Usus besar menyerap air dan mineral, dan bakteri baiknya menghasilkan vitamin K. Sisa makanan menjadi feses yang padat." } },
  { id: 'rectum', n: { en: 'Rectum', id: 'Rektum' }, e: '📦',
    i: { en: "The last part of the large intestine. It stores feces until you are ready to go to the toilet.",
         id: "Bagian akhir usus besar. Rektum menyimpan feses sampai kamu siap pergi ke toilet." } },
  { id: 'anus', n: { en: 'Anus', id: 'Anus' }, e: '🚪',
    i: { en: "The exit! A ring of muscle called a sphincter controls when feces leave the body. This is called egestion (defecation).",
         id: "Pintu keluar! Cincin otot yang disebut sfingter mengatur kapan feses keluar dari tubuh. Proses ini disebut defekasi (egesti)." } }
];
const orgById = id => ORG.find(o => o.id === id);

/* ============ diagram ============ */
function diagramSVG() {
  const og = (id, inner) => `<g class="organ" data-id="${id}">${inner}</g>`;
  return `<svg class="diagram" viewBox="0 0 300 470" xmlns="http://www.w3.org/2000/svg">
  <path d="M70 142 Q70 120 102 118 L198 118 Q230 120 230 142 L238 400 Q238 440 200 446 L100 446 Q62 440 62 400 Z" fill="#ffe4cf" stroke="#f3c9a8" stroke-width="2"/>
  <rect x="133" y="90" width="34" height="36" rx="8" fill="#ffe4cf"/>

function starsFrom(frac) { return frac >= .9 ? 3 : frac >= .6 ? 2 : 1; }
function levelComplete(n, score, stars, line) {
  const prev = store.best[n] || { score: 0, stars: 0 };

/* ============ LEVEL 1: Organ Explorer ============ */
function startL1() {
  window.scrollTo(0, 0);
  let phase = 'explore', seen = new Set(), queue = [], cur = null, tries = 0, score = 0, firstTry = 0, lock = false;
  app.innerHTML = `<div class="lvhead"><h2>🔍 ${tx('Level 1 · Organ Explorer', 'Level 1 · Penjelajah Organ')}</h2><div class="spacer"></div><div class="pill" id="sc">${tx('Score', 'Skor')}: 0</div></div>
    <div id="prompt"></div>
    <div class="split"><div class="diagwrap">${diagramSVG()}</div><div class="card" id="side"></div></div>`;
  const svg = app.querySelector('svg'), side = $('#side'), prompt = $('#prompt');
  const G = id => svg.querySelector(`.organ[data-id="${id}"]`);

  function explore(id) {
    const o = id && orgById(id);
    side.innerHTML = (o ? `<div class="infobox"><h3>${o.e} ${L(o.n)}</h3><p>${L(o.i)}</p></div>`
      : say(tx("<b>Step 1: Explore!</b> Tap each organ on the body (or the name buttons) to learn what it does. When you've met all 10, start the speed hunt!", '<b>Langkah 1: Jelajahi!</b> Ketuk setiap organ di tubuh (atau tombol nama) untuk mempelajari fungsinya. Setelah mengenal 10 organ, mulai perburuan kilat!')))
      + `<div class="chips">${ORG.map(x => `<span class="chip ${seen.has(x.id) ? 'seen' : ''} ${x.id === id ? 'cur' : ''}" data-id="${x.id}">${seen.has(x.id) ? '✅' : '❔'} ${L(x.n)}</span>`).join('')}</div>
      <p style="font-weight:800">${tx('Organs met', 'Organ dikenal')}: ${seen.size}/10</p>
      <button class="btn ${seen.size === 10 ? 'teal' : 'ghost'}" id="huntBtn">${seen.size === 10 ? tx('Start the speed hunt! 🏁', 'Mulai perburuan kilat! 🏁') : tx('Skip to the hunt →', 'Langsung ke perburuan →')}</button>`;
    side.querySelectorAll('.chip').forEach(c => c.onclick = () => pick(c.dataset.id));
    $('#huntBtn').onclick = startHunt;
  }
  function pick(id) {
    if (phase === 'explore') {
      sfx.pop(); const first = !seen.has(id); seen.add(id);
      svg.querySelectorAll('.organ').forEach(g => g.classList.remove('glow')); G(id).classList.add('glow');
      explore(id); if (first && seen.size === 10) { sfx.win(); }
      if (isNarrow()) scrollToEl(side);
    } else hunt(id);
  }
  function startHunt() {
    phase = 'hunt'; queue = shuffle(ORG.map(o => o.id));
    svg.querySelectorAll('.organ').forEach(g => g.classList.remove('glow'));
    side.innerHTML = say(tx('<b>Step 2: Speed hunt!</b> I will name an organ — tap it on the body. First try = 100 points!', '<b>Langkah 2: Perburuan kilat!</b> Aku akan menyebut nama organ — ketuk organ itu di tubuh. Benar di percobaan pertama = 100 poin!'));
    nextTarget();
  }
  function nextTarget() {
    if (!queue.length) {
      prompt.innerHTML = '';
      const stars = starsFrom(score / 1000);
      return levelComplete(1, score, stars, tx(`Found on first try: ${firstTry}/10`, `Ditemukan di percobaan pertama: ${firstTry}/10`));
    }
    cur = queue.shift(); tries = 0; lock = false;
    prompt.innerHTML = `<div class="prompt">${tx('Find the', 'Temukan')}: <b>${L(orgById(cur).n)}</b> · ${10 - queue.length}/10</div>`;
  }
  function hunt(id) {
    if (lock) return;
    const g = G(id);
    if (id === cur) {
      lock = true; const pts = [100, 60, 30][Math.min(tries, 2)]; score += pts; if (!tries) firstTry++;
      sfx.ok(); g.classList.add('ok'); floatText(g, '+' + pts);
      $('#sc').textContent = tx('Score', 'Skor') + ': ' + score;
      const o = orgById(id);
      side.innerHTML = `<div class="ex good"><b>✅ ${tx('Yes! That\'s the', 'Ya! Itu')} ${L(o.n).toLowerCase()}!</b><br>${L(o.i)}</div>`;
      setTimeout(() => { g.classList.remove('ok'); nextTarget(); }, 1500);
    } else {
      tries++; sfx.bad(); flash(g, 'bad', 600);
      side.innerHTML = `<div class="ex nope"><b>❌ ${tx('Oops! That\'s the', 'Ups! Itu')} ${L(orgById(id).n).toLowerCase()}.</b> ${tx('Try again!', 'Coba lagi!')}</div>`;
      if (tries >= 3) { const t = G(cur); t.classList.add('glow'); setTimeout(() => t.classList.remove('glow'), 1500); side.innerHTML += `<p style="font-weight:700">💡 ${tx('Hint: look at the glowing organ!', 'Petunjuk: lihat organ yang bersinar!')}</p>`; }
    }
  }
  bindOrgans(svg, pick);
  explore(null);
}

const FOODS = [['🍛', 'Nasi goreng', 'Nasi goreng'], ['🍔', 'Burger', 'Burger'], ['🍜', 'Noodles', 'Mi ayam'], ['🍌', 'Banana', 'Pisang']];

function startL2() {
  window.scrollTo(0, 0);
  let si = 0, pos = 0, score = 0, correct = 0, food = '🍛', meter = { carb: 0, protein: 0, fat: 0, water: 0 };
  app.innerHTML = `<div class="lvhead"><h2>🍛 ${tx('Level 2 · Journey of a Bite', 'Level 2 · Perjalanan Sesuap Makanan')}</h2><div class="spacer"></div><div class="pill" id="sc">${tx('Score', 'Skor')}: 0</div></div>
    <div class="stepper" id="stepper">${STATIONS.map(() => '<span></span>').join('')}</div>
    <div class="split"><div class="diagwrap">${diagramSVG()}
      <div class="meter" id="meter" style="padding:0 8px 8px"></div></div><div class="card" id="side"></div></div>`;
  const svg = app.querySelector('svg'), side = $('#side'), foodEl = svg.querySelector('#food');
  const MB = [['carb', tx('Carbohydrate', 'Karbohidrat'), '#f59e0b'], ['protein', 'Protein', '#ef4444'], ['fat', tx('Fat', 'Lemak'), '#eab308'], ['water', tx('Water absorbed', 'Air diserap'), '#3b82f6']];
  $('#meter').innerHTML = `<b style="font-size:.9rem">${tx('Digestion meter', 'Meteran pencernaan')}</b>` + MB.map(m => `<div class="m"><span>${m[1]}</span><div class="bar"><i id="mb-${m[0]}" style="background:${m[2]}"></i></div><span id="mv-${m[0]}">0%</span></div>`).join('');
  function drawMeter() { MB.forEach(m => { $('#mb-' + m[0]).style.width = meter[m[0]] + '%'; $('#mv-' + m[0]).textContent = meter[m[0]] + '%'; }); }
  function stepper() { $('#stepper').querySelectorAll('span').forEach((s, i) => s.className = i < si ? 'done' : i === si ? 'now' : ''); }
  function highlight(ids) { svg.querySelectorAll('.organ').forEach(g => { g.classList.toggle('glow', ids.includes(g.dataset.id)); }); }
  function placeFood(x, y) { foodEl.setAttribute('x', x); foodEl.setAttribute('y', y); }
  const idxOf = key => JP.findIndex(p => p[2] === key);

  function moveTo(targetIdx, cb) {
    // build list of points from pos to targetIdx
    const pts = JP.slice(pos, targetIdx + 1);
    const segs = []; let total = 0;
    for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); segs.push(d); total += d; }
    if (!total) { pos = targetIdx; return cb(); }
    const dur = Math.max(900, total / 0.13); let t0 = null;
    sfx.gulp();
    function frame(ts) {
      if (!t0) t0 = ts; let dist = Math.min(1, (ts - t0) / dur) * total;
      let i = 0; while (i < segs.length - 1 && dist > segs[i]) { dist -= segs[i]; i++; }
      const f = segs[i] ? Math.min(1, dist / segs[i]) : 1;
      placeFood(pts[i][0] + (pts[i + 1][0] - pts[i][0]) * f, pts[i][1] + (pts[i + 1][1] - pts[i][1]) * f);
      if ((ts - t0) < dur) requestAnimationFrame(frame); else { pos = targetIdx; cb(); }
    }
    requestAnimationFrame(frame);
  }

  function chooseFood() {
    highlight([]);
    side.innerHTML = say(tx("I'm hungry! 🐶 Pick a food and we'll follow it all the way through the body. At every stop, answer 2 questions to keep the journey going!", 'Aku lapar! 🐶 Pilih makanan, lalu kita ikuti perjalanannya di dalam tubuh. Di setiap pemberhentian, jawab 2 pertanyaan agar perjalanan berlanjut!'))
      + `<div class="foods">${FOODS.map(f => `<button class="food" data-f="${f[0]}">${f[0]}<small>${tx(f[1], f[2])}</small></button>`).join('')}</div>`;
    side.querySelectorAll('.food').forEach(b => b.onclick = () => { food = b.dataset.f; foodEl.textContent = food; foodEl.setAttribute('font-size', STATIONS[0].size); sfx.gulp(); showStation(); });
  }
  function showStation() {
    const st = STATIONS[si]; stepper(); highlight(st.org);
    foodEl.setAttribute('font-size', st.size);
    side.innerHTML = `<h3 style="margin:0 0 8px;color:var(--coral-d)">📍 ${tx('Stop', 'Pemberhentian')} ${si + 1}/6 · ${L(st.n)}</h3>` + say(L(st.t)) + `<button class="btn teal" id="goQ">${tx('Quiz time!', 'Waktunya kuis!')} ❓</button>`;
    $('#goQ').onclick = () => ask(0); scrollToEl(side);
  }
  function ask(j) {
    const st = STATIONS[si], q = st.qs[j];
    const opts = shuffle(q.a.map((a, k) => ({ t: L(a), ok: k === 0 })));
    side.innerHTML = `<h3 style="margin:0 0 8px;color:var(--coral-d)">📍 ${L(st.n)} · ${tx('Question', 'Soal')} ${j + 1}/2</h3><p class="q">${L(q.q)}</p>
      <div class="opts">${opts.map((o, k) => `<button class="opt" data-k="${k}">${o.t}</button>`).join('')}</div><div id="fb"></div>`;
    side.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      const o = opts[b.dataset.k];
      side.querySelectorAll('.opt').forEach((x, k) => { x.disabled = true; if (opts[k].ok) x.classList.add('right'); });
      if (o.ok) { score += 100; correct++; sfx.ok(); floatText(b, '+100'); } else { b.classList.add('wrong'); sfx.bad(); }
      $('#sc').textContent = tx('Score', 'Skor') + ': ' + score;
      $('#fb').innerHTML = `<div class="ex ${o.ok ? 'good' : 'nope'}"><b>${o.ok ? tx('Correct! 🎉', 'Benar! 🎉') : tx('Not quite!', 'Belum tepat!')}</b> ${L(q.ex)}</div>
        <button class="btn" style="margin-top:12px" id="nx">${j === 0 ? tx('Next question', 'Soal berikutnya') : (si === STATIONS.length - 1 ? tx('Finish the journey! 🚽', 'Selesaikan perjalanan! 🚽') : tx('Continue the journey', 'Lanjutkan perjalanan'))} →</button>`;
      $('#nx').onclick = () => j === 0 ? ask(1) : finishStation();
    });
  }
  function finishStation() {
    const st = STATIONS[si]; Object.assign(meter, st.meter); drawMeter();
    if (st.poop) foodEl.textContent = '💩';
    si++;
    if (si >= STATIONS.length) {
      stepper(); highlight([]);
      side.innerHTML = say(tx('Bye-bye, leftovers! 💩👋 The journey took about 1–3 days in real life!', 'Dadah, sisa makanan! 💩👋 Di tubuh sungguhan, perjalanan ini memakan waktu sekitar 1–3 hari!'));
      moveTo(JP.length - 1, () => { foodEl.setAttribute('font-size', 0); levelComplete(2, score, starsFrom(correct / 12), tx(`Correct answers: ${correct}/12`, `Jawaban benar: ${correct}/12`)); });
      return;
    }
    side.innerHTML = say(tx('Here we go! Next stop: ', 'Ayo berangkat! Pemberhentian berikutnya: ') + '<b>' + L(STATIONS[si].n) + '</b>');
    moveTo(idxOf(STATIONS[si].key), showStation);
  }
  drawMeter(); stepper();
  foodEl.textContent = food; placeFood(JP[0][0], JP[0][1]);
  chooseFood();
}

function startL3() {
  window.scrollTo(0, 0);
  let r = 0, score = 0, totalPairs = SETS.reduce((s, x) => s + x.pairs.length, 0), totalMistakes = 0;
  function round() {
    const set = SETS[r]; let selL = null, selR = null, done = 0, mistakes = 0, lock = false;
    const left = shuffle(set.pairs.map((p, i) => ({ i, t: L(p[0]) }))), right = shuffle(set.pairs.map((p, i) => ({ i, t: L(p[1]) })));
    app.innerHTML = `<div class="lvhead"><h2>🧪 ${tx('Level 3 · Enzyme Lab', 'Level 3 · Lab Enzim')}</h2><div class="spacer"></div><div class="pill" id="sc">${tx('Score', 'Skor')}: ${score}</div></div>
      <div class="card">
        ${say(r === 0 ? tx("Welcome to my lab! 🥼 Tap an item on the left, then its matching job on the right. Fewer mistakes = more points!", 'Selamat datang di labku! 🥼 Ketuk satu kotak di kiri, lalu pasangan tugasnya di kanan. Makin sedikit salah = makin banyak poin!') : tx('Great work! Ready for the next round?', 'Hebat! Siap untuk ronde berikutnya?'))}
        <h3 style="margin:0 0 4px">${L(set.t)}</h3>
        <p style="margin:0 0 12px;font-weight:700;color:var(--muted)">${tx('Matched', 'Cocok')}: <span id="dn">0</span>/${set.pairs.length} · ${tx('Mistakes', 'Kesalahan')}: <span id="mk">0</span></p>
        <div class="match"><div class="col">${left.map(x => `<button class="mbtn left" data-s="L" data-i="${x.i}">${x.t}</button>`).join('')}</div>
        <div class="col">${right.map(x => `<button class="mbtn" data-s="R" data-i="${x.i}">${x.t}</button>`).join('')}</div></div>
      </div>`;
    app.querySelectorAll('.mbtn').forEach(b => b.onclick = () => {
      if (lock || b.classList.contains('done')) return;
      sfx.click();
      if (b.dataset.s === 'L') { if (selL) selL.classList.remove('sel'); selL = b; } else { if (selR) selR.classList.remove('sel'); selR = b; }
      b.classList.add('sel');
      if (selL && selR) {
        const a = selL, c = selR; selL = selR = null;
        if (a.dataset.i === c.dataset.i) {
          sfx.ok(); [a, c].forEach(x => { x.classList.remove('sel'); x.classList.add('done'); }); done++; score += 100; floatText(c, '+100');
          $('#dn').textContent = done;
          if (done === set.pairs.length) setTimeout(() => { r++; if (r < SETS.length) round(); else finish(); }, 800);
        } else {
          sfx.bad(); mistakes++; totalMistakes++; score = Math.max(0, score - 30); lock = true;
          [a, c].forEach(x => { x.classList.remove('sel'); x.classList.add('err'); });
          setTimeout(() => { [a, c].forEach(x => x.classList.remove('err')); lock = false; }, 450);
          $('#mk').textContent = mistakes;
        }
        $('#sc').textContent = tx('Score', 'Skor') + ': ' + score;
      }
    });
  }
  function finish() { levelComplete(3, score, starsFrom(score / (totalPairs * 100)), tx(`Total mistakes: ${totalMistakes}`, `Total kesalahan: ${totalMistakes}`)); }
  round();
}

    'Water, vitamins and minerals are small enough to be absorbed directly. Big molecules like starch, protein and fat must be broken down first.', 'Air, vitamin, dan mineral cukup kecil untuk langsung diserap. Molekul besar seperti amilum, protein, dan lemak harus dipecah terlebih dahulu.'),
  Q('How many permanent teeth does an adult usually have (including wisdom teeth)?', 'Berapa jumlah gigi tetap orang dewasa (termasuk gigi bungsu)?', [['32', '32'], ['20', '20'], ['24', '24'], ['40', '40']],
    'Children have 20 baby (milk) teeth. Adults have 32 permanent teeth if all 4 wisdom teeth grow.', 'Anak-anak memiliki 20 gigi susu. Orang dewasa memiliki 32 gigi tetap jika keempat gigi bungsu tumbuh.'),
  TF('Starch digestion begins in the stomach.', 'Pencernaan amilum dimulai di lambung.', false,
    'False! It begins in the mouth, thanks to salivary amylase.', 'Salah! Pencernaan amilum dimulai di mulut, berkat enzim amilase dalam ludah.'),
  Q('Proteins are finally broken down into…', 'Protein akhirnya dipecah menjadi…', [['Amino acids', 'Asam amino'], ['Glucose', 'Glukosa'], ['Fatty acids', 'Asam lemak'], ['Vitamins', 'Vitamin']],
    'Your body uses amino acids to build muscles, enzymes and much more.', 'Tubuhmu menggunakan asam amino untuk membangun otot, enzim, dan banyak lagi.'),
  Q('Diarrhea is dangerous mainly because the body loses…', 'Diare berbahaya terutama karena tubuh kehilangan…', [['Water and salts (dehydration)', 'Air dan garam (dehidrasi)'], ['Teeth', 'Gigi'], ['Bile', 'Empedu'], ['Bone', 'Tulang']],
    'Oral rehydration salts (oralit) and plenty of fluids help replace what is lost.', 'Oralit dan banyak minum cairan membantu menggantikan cairan yang hilang.'),
  TF('Bile is an enzyme.', 'Empedu adalah enzim.', false,
    'False! Bile contains no enzymes. It emulsifies fat (breaks it into droplets) so lipase can work faster.', 'Salah! Empedu tidak mengandung enzim. Empedu mengemulsikan lemak (memecahnya menjadi butiran) agar lipase bekerja lebih cepat.'),
  Q('The ring of muscle that controls food leaving the stomach is the…', 'Cincin otot yang mengatur keluarnya makanan dari lambung adalah…', [['Pyloric sphincter', 'Sfingter pilorus'], ['Epiglottis', 'Epiglotis'], ['Villus', 'Vili'], ['Appendix', 'Usus buntu']],
    'The pyloric sphincter lets chyme into the small intestine a little at a time.', 'Sfingter pilorus mengalirkan kimus ke usus halus sedikit demi sedikit.'),
  TF('Most nutrients are absorbed in the small intestine.', 'Sebagian besar sari makanan diserap di usus halus.', true,
    'True! The large intestine mainly absorbs water and minerals.', 'Benar! Usus besar terutama menyerap air dan mineral.'),
  Q('What do we call the soupy mix of food and gastric juice that leaves the stomach?', 'Apa nama bubur campuran makanan dan getah lambung yang keluar dari lambung?', [['Chyme', 'Kimus'], ['Bolus', 'Bolus'], ['Bile', 'Empedu'], ['Feces', 'Feses']],
    'Bolus = the ball of chewed food from the mouth. Chyme = the soupy mix from the stomach.', 'Bolus = gumpalan makanan dari mulut. Kimus = bubur makanan dari lambung.')
];
function startL4() {
  window.scrollTo(0, 0);
  const qs = shuffle(TRIVIA).slice(0, 12), TIME = 20;
  let i = 0, score = 0, correct = 0, streak = 0, best = 0, timer = null;
  app.innerHTML = `<div class="lvhead"><h2>⚡ ${tx('Level 4 · Trivia Blitz', 'Level 4 · Kuis Kilat')}</h2><div class="spacer"></div><div class="pill" id="sc">${tx('Score', 'Skor')}: 0</div></div>
    <div class="card" style="max-width:720px;margin:0 auto" id="box"></div>`;
  const box = $('#box');
  function intro() {
    box.innerHTML = say(tx("Time for my favourite part — weird and wonderful gut trivia! 🤓 12 questions, 20 seconds each. Answer fast for bonus points and build a streak 🔥 for even more!", 'Saatnya bagian favoritku — kuis fakta unik pencernaan! 🤓 12 soal, masing-masing 20 detik. Jawab cepat untuk poin bonus dan buat rentetan benar 🔥 untuk poin lebih banyak!'))
      + `<button class="btn teal" id="go">${tx('Start!', 'Mulai!')} ⚡</button>`;
    $('#go').onclick = show;
  }
  function show() {
    const q = qs[i], opts = shuffle(q.a.map((a, k) => ({ t: L(a), ok: k === 0 })));
    if (opts.length === 2) { const T = tx('True', 'Benar'); opts.sort((a, b) => (b.t === T) - (a.t === T)); } // keep True first
    box.innerHTML = `<div class="row" style="justify-content:space-between;font-weight:800"><span>${tx('Question', 'Soal')} ${i + 1}/12</span><span class="streak">${streak >= 2 ? '🔥 ' + tx('Streak', 'Rentetan') + ' ×' + streak : ''}</span><span id="tl">${TIME}s</span></div>
      <div class="timer"><i id="tb"></i></div>
      <p class="q">${L(q.q)}</p><div class="opts">${opts.map((o, k) => `<button class="opt" data-k="${k}">${o.t}</button>`).join('')}</div><div id="fb"></div>`;
    const start = performance.now(), tb = $('#tb'), tl = $('#tl');
    let answered = false;
    function tick() {
      const left = Math.max(0, TIME - (performance.now() - start) / 1000);
      tb.style.width = (left / TIME * 100) + '%'; tl.textContent = Math.ceil(left) + 's';
      if (left <= 0) return answer(null, 0);
      timer = requestAnimationFrame(tick);
    }
    function answer(btn, left) {
      if (answered) return; answered = true; cancelAnimationFrame(timer);
      const o = btn ? opts[btn.dataset.k] : null;
      box.querySelectorAll('.opt').forEach((x, k) => { x.disabled = true; if (opts[k].ok) x.classList.add('right'); });
      let msg;
      if (o && o.ok) {
        streak++; best = Math.max(best, streak); correct++;
        const pts = 100 + Math.round(left * 5) + (streak >= 2 ? (streak - 1) * 20 : 0);
        score += pts; sfx.ok(); floatText(btn, '+' + pts);
        msg = `<b>${tx('Correct!', 'Benar!')} +${pts}</b>`;
      } else {
        streak = 0; sfx.bad(); if (btn) btn.classList.add('wrong');
        msg = `<b>${btn ? tx('Oops!', 'Ups!') : tx("⏰ Time's up!", '⏰ Waktu habis!')}</b>`;
      }
      $('#sc').textContent = tx('Score', 'Skor') + ': ' + score;
      $('#fb').innerHTML = `<div class="ex ${o && o.ok ? 'good' : 'nope'}">${msg} 💡 <i>${tx('Did you know?', 'Tahukah kamu?')}</i> ${L(q.ex)}</div>
        <button class="btn" style="margin-top:12px" id="nx">${i < 11 ? tx('Next', 'Lanjut') + ' →' : tx('Finish', 'Selesai') + ' 🏁'}</button>`;
      $('#nx').onclick = () => { i++; i < 12 ? show() : levelComplete(4, score, starsFrom(correct / 12), tx(`Correct: ${correct}/12 · Best streak: ${best} 🔥`, `Benar: ${correct}/12 · Rentetan terbaik: ${best} 🔥`)); };
    }
    box.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(b, Math.max(0, TIME - (performance.now() - start) / 1000)));
    timer = requestAnimationFrame(tick);
  }
  intro();
}

/* ============ CERTIFICATE ============ */
function renderCert() {
  updateHeader(); window.scrollTo(0, 0);
  const st = totalStars();
  const rank = st >= 12 ? tx('🏆 Gut Guru', '🏆 Master Pencernaan') : st >= 9 ? tx('🥇 Tummy Expert', '🥇 Ahli Perut') : st >= 5 ? tx('🔎 Digestion Detective', '🔎 Detektif Pencernaan') : tx('🌱 Gut Rookie', '🌱 Pemula Pencernaan');
  const date = new Date().toLocaleDateString(lang === 'id' ? 'id-ID' : 'en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
  app.innerHTML = `<div class="card cert">
    ${bubbleSVG('bubble-big')}
    <h1>${tx('Certificate of Digestion Mastery', 'Sertifikat Penguasaan Sistem Pencernaan')}</h1>
    <p style="font-weight:700;margin:0">${tx('This certifies that', 'Diberikan kepada')}</p>
    <div class="who">${(playerName || tx('Super Scientist', 'Ilmuwan Hebat')).replace(/</g, '&lt;')}</div>
    <p style="font-weight:700;margin:0">${tx("has travelled through the digestive system in Bubble's Tummy Trek and earned the rank of", 'telah menjelajahi sistem pencernaan dalam Petualangan Perut Bubble dan meraih gelar')}</p>
    <div class="rank">${rank}</div>
    <table>${LEVELS.map(l => { const b = store.best[l.n]; return `<tr><td>${l.emo} ${L(l.t)}</td><td>${b ? starStr(b.stars) : '—'}</td><td>${b ? b.score : 0}</td></tr>`; }).join('')}
      <tr><td><b>${tx('Total', 'Total')}</b></td><td><b>${st}/12 ⭐</b></td><td><b>${totalScore()}</b></td></tr></table>
    <p style="font-weight:700;color:var(--muted)">${date} · ${tx('Signed', 'Ditandatangani')}: Bubble 🐾</p>
    <div class="row noprint" style="justify-content:center">
      <button class="btn teal" onclick="window.print()">🖨️ ${tx('Print / Save PDF', 'Cetak / Simpan PDF')}</button>
      <button class="btn ghost" id="cMenu">🏠 ${tx('Menu', 'Menu')}</button>
      <button class="btn ghost" id="cReset">🗑️ ${tx('Reset progress', 'Hapus progres')}</button>
    </div>
    ${playerName ? '' : `<p class="noprint" style="font-weight:700;color:var(--coral-d)">✏️ ${tx('Tip: type your name on the menu page to put it on the certificate!', 'Tips: ketik namamu di halaman menu agar tercantum di sertifikat!')}</p>`}
  </div>`;
  if (st >= 9) confetti();
  $('#cMenu').onclick = renderHome;
  $('#cReset').onclick = () => { if (confirm(tx('Erase all stars and scores?', 'Hapus semua bintang dan skor?'))) { store.best = {}; persist(); renderHome(); } };
}

/* ============ boot ============ */
$('#homeBtn').onclick = () => { $('#modal').classList.remove('show'); renderHome(); };
$('#logo').onclick = $('#homeBtn').onclick;
$('#soundBtn').onclick = () => { muted = !muted; persist(); updateHeader(); if (!muted) sfx.pop(); };
renderHome();
</script>
</body>
